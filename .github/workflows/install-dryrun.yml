name: 安装链路干跑

# 安装脚本自己会坏 —— 改了目录结构、改了 venv 路径、删了个文件，都可能让它挂。
# 这个 job 保证「新手按 README 走」这条路至少不会在第一步就崩。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  dryrun:
    name: install --check + doctor
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "${{ matrix.python-version }}"

      # 先守编码：.bat 必须纯 ASCII、含中文的 .ps1 必须带 BOM、.sh 必须 LF。
      # 这是"本地测试抓不到、但用户打开就炸"的一类问题 —— 曾经 install.bat
      # 因为中文注释压在 chcp 之前，在中文 Windows 上散架成一片
      # "不是内部或外部命令"，而所有测试都是绿的。
      - name: 脚本编码守卫
        run: python tools/normalize_scripts.py --quiet

      - name: 兼容性守卫
        run: python tools/compat_check.py

      # --check / -CheckOnly 在「环境还没就绪」时返回 1（没有 venv、跳过体检），
      # 这是脚本约定的语义，不是失败 —— 所以这里只拦真正的错误码。
      - name: install.sh --check（只读，不动文件）
        if: runner.os != 'Windows'
        run: |
          set +e
          bash install.sh --check
          rc=$?
          set -e
          echo "退出码 = $rc（只读干跑返回 0 或 1 都算正常）"
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 1 ]; then exit "$rc"; fi

      - name: install.ps1 -CheckOnly（只读）
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./install.ps1 -CheckOnly
          $rc = $LASTEXITCODE
          Write-Host "退出码 = $rc（只读干跑返回 0 或 1 都算正常）"
          if ($rc -ne 0 -and $rc -ne 1) { throw "install.ps1 意外退出码：$rc" }
          # 必须显式 exit 0：pwsh 会把 $LASTEXITCODE 带出进程，上面那个 if 判断通过
          # 归通过，步骤照样会被判成失败（这行不加，这一整步永远红）。
          exit 0

      # 上面那步走的是 .ps1。但用户双击的是 install.bat —— 而这一轮翻的车
      # 恰恰就在 .bat 上，所以必须把"真正被双击的那个文件"也跑一遍。
      # QQBOT_NO_PAUSE=1 让它跳过结尾的按键等待。
      - name: install.bat（用户双击的入口，非交互跑一遍）
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          QQBOT_NO_PAUSE: "1"
        run: |
          cmd.exe /c "install.bat -CheckOnly"
          $rc = $LASTEXITCODE
          Write-Host "install.bat 退出码 = $rc"
          # 只读干跑时没有 venv、跳过 npm，返回 1 是预期值，不是失败
          if ($rc -ne 0 -and $rc -ne 1) { throw "install.bat 意外退出码：$rc" }

      # 环境探测是安装链路里唯一能在三种系统上都真跑的环节，所以必须每平台真跑一遍。
      # 报告写到 $RUNNER_TEMP（仓库外），免得污染工作区、影响下面那条"只读"断言。
      # check_env_report.py 会校验结构，也会校验取值（比如 python.version 必须
      # 真的是 x.y.z 且 >=3.11）—— 探测悄悄返回垃圾是这类代码最常见的坏法。
      - name: 环境探测（install.sh --detect --json）
        if: runner.os != 'Windows'
        run: |
          mkdir -p "$RUNNER_TEMP/envprobe"
          bash install.sh --detect --json > "$RUNNER_TEMP/envprobe/env-sh.json"
          python tools/check_env_report.py "$RUNNER_TEMP/envprobe/env-sh.json"

      - name: 环境探测（install.ps1 -DetectOnly -Json）
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP "envprobe"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          ./install.ps1 -DetectOnly -Json > (Join-Path $out "env-ps.json")
          python tools/check_env_report.py (Join-Path $out "env-ps.json")

      # Windows 上两份实现同时在场，正好互相印证：探测出来的**事实**必须一致
      # （选中的解释器可以不同 —— 两份实现按各自优先级挑 Python，挑到 3.12 还是
      # 3.11 都对）。这是防止「只改了 .sh，Windows 那份悄悄长歪」的机器闸门。
      - name: 两份探测实现必须互相认同
        if: runner.os == 'Windows'
        shell: bash
        run: |
          bash install.sh --detect --json > "$RUNNER_TEMP/envprobe/env-sh.json"
          python tools/check_env_report.py --compare \
            "$RUNNER_TEMP/envprobe/env-sh.json" "$RUNNER_TEMP/envprobe/env-ps.json"

      # 「--check 只读」以前只是脚本里的一句注释，现在让机器守：
      # 跑之前后各打一次 git status，必须一个字都不差。
      - name: --check / -CheckOnly 真的没动任何文件
        shell: bash
        run: |
          before=$(git status --porcelain)
          set +e
          if [ "$RUNNER_OS" = "Windows" ]; then
            QQBOT_NO_PAUSE=1 cmd.exe //c "install.bat -CheckOnly" >/dev/null 2>&1
          else
            bash install.sh --check >/dev/null 2>&1
          fi
          rc=$?
          set -e
          after=$(git status --porcelain)
          echo "退出码 = $rc（只读干跑返回 0 或 1 都算正常）"
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 1 ]; then
            echo "::error::只读干跑意外退出码：$rc"; exit 1
          fi
          if [ "$before" != "$after" ]; then
            echo "::error::只读模式动了文件！下面是前后差异："
            diff <(echo "$before") <(echo "$after") || true
            exit 1
          fi
          echo "没有文件被改动。"

      - name: doctor 能在"还没配置"的状态下给出结论
        shell: bash
        run: |
          # 这一步故意不建 venv —— 就是要验证 doctor 在坏环境下也能跑完并报出问题，
          # 而不是自己崩掉（"体检工具自己挂"是最没用的体检工具）。
          set +e
          python qqbot/tools/doctor.py --json > doctor.json
          RC=$?
          set -e
          echo "doctor 退出码 = $RC（期望非 0：还没配 config.json / 没 venv）"
          python - <<'PY'
          import json, sys
          d = json.load(open("doctor.json", encoding="utf-8"))
          assert "checks" in d and d["checks"], "doctor 没输出任何检查项"
          ids = [c["id"] for c in d["checks"]]
          print("检查项：", ", ".join(ids))
          # 这两项在裸仓库里必然报错，能报出来才说明它真的在工作
          assert "D4" in ids or "D2" in ids, "doctor 缺少最基本的检查项"
          print("doctor 输出结构正常")
          PY
