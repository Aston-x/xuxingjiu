name: 安装链路干跑

# 安装脚本自己会坏 —— 改了目录结构、改了 venv 路径、删了个文件，都可能让它挂。
# 这个 job 保证「新手按 README 走」这条路至少不会在第一步就崩。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  dryrun:
    name: install --check + doctor
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "${{ matrix.python-version }}"

      # 先守编码：.bat 必须纯 ASCII、含中文的 .ps1 必须带 BOM、.sh 必须 LF。
      # 这是"本地测试抓不到、但用户打开就炸"的一类问题 —— 曾经 install.bat
      # 因为中文注释压在 chcp 之前，在中文 Windows 上散架成一片
      # "不是内部或外部命令"，而所有测试都是绿的。
      - name: 脚本编码守卫
        run: python tools/normalize_scripts.py --quiet

      - name: 兼容性守卫
        run: python tools/compat_check.py

      - name: install.sh --check（只读，不动文件）
        if: runner.os != 'Windows'
        run: bash install.sh --check

      - name: install.ps1 -CheckOnly（只读）
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./install.ps1 -CheckOnly

      # 上面那步走的是 .ps1。但用户双击的是 install.bat —— 而这一轮翻的车
      # 恰恰就在 .bat 上，所以必须把"真正被双击的那个文件"也跑一遍。
      # QQBOT_NO_PAUSE=1 让它跳过结尾的按键等待。
      - name: install.bat（用户双击的入口，非交互跑一遍）
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          QQBOT_NO_PAUSE: "1"
        run: |
          cmd.exe /c "install.bat -CheckOnly"
          $rc = $LASTEXITCODE
          Write-Host "install.bat 退出码 = $rc"
          # 只读干跑时没有 venv、跳过 npm，返回 1 是预期值，不是失败
          if ($rc -ne 0 -and $rc -ne 1) { throw "install.bat 意外退出码：$rc" }

      - name: doctor 能在"还没配置"的状态下给出结论
        shell: bash
        run: |
          # 这一步故意不建 venv —— 就是要验证 doctor 在坏环境下也能跑完并报出问题，
          # 而不是自己崩掉（"体检工具自己挂"是最没用的体检工具）。
          set +e
          python qqbot/tools/doctor.py --json > doctor.json
          RC=$?
          set -e
          echo "doctor 退出码 = $RC（期望非 0：还没配 config.json / 没 venv）"
          python - <<'PY'
          import json, sys
          d = json.load(open("doctor.json", encoding="utf-8"))
          assert "checks" in d and d["checks"], "doctor 没输出任何检查项"
          ids = [c["id"] for c in d["checks"]]
          print("检查项：", ", ".join(ids))
          # 这两项在裸仓库里必然报错，能报出来才说明它真的在工作
          assert "D4" in ids or "D2" in ids, "doctor 缺少最基本的检查项"
          print("doctor 输出结构正常")
          PY
