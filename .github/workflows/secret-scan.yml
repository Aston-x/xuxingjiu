name: 敏感信息扫描

# 这个 job 的作用不是"假装很安全"，而是**挡住手滑**：
# 谁哪天不小心 git add 进来一个 config.json，这里会立刻变红。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  scan:
    name: 扫密钥 / 真实 QQ 号 / 本机路径
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # 需要看历史提交

      - name: 工作区扫描（与 tools/preflight.sh 同一套规则）
        run: bash tools/preflight.sh

      - name: 历史提交扫描
        run: |
          set -e
          # 只看**提交进去的内容**（-p 展开补丁），排除依赖目录
          HITS=$(git log --all -p -- . \
                 ':!**/node_modules/**' ':!**/package-lock.json' \
                 | grep -nE 'sk-[A-Za-z0-9_-]{20,}|(SESSDATA|bili_jct|superkey|p_skey)=[[:alnum:]%@_.-]{12,}' \
                 | grep -vE 'REDACTED|xxxx|XXX|example|placeholder|sk-\.\.\.' | head -20 || true)
          if [ -n "$HITS" ]; then
            echo "::error::历史提交里发现疑似密钥，请先吊销它再改写历史（见 docs/开源指南.md §0.2）"
            echo "$HITS"
            exit 1
          fi
          echo "历史提交干净。"

      - name: 确认没有敏感文件被跟踪
        run: |
          set -e
          BAD=$(git ls-files | grep -E '(^|/)(config\.json|\.env)$|_state\.json$|memory\.json$|mood\.json$|bili_state\.json$|\.log$' || true)
          if [ -n "$BAD" ]; then
            echo "::error::这些文件不该进版本库："
            echo "$BAD"
            exit 1
          fi
          echo "没有被跟踪的敏感文件。"
