name: 敏感信息扫描

# 这个 job 的作用不是"假装很安全"，而是**挡住手滑**：
# 谁哪天不小心 git add 进来一个 config.json，这里会立刻变红。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  scan:
    name: 扫密钥 / 真实 QQ 号 / 本机路径
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # 需要看历史提交

      - name: 工作区 + 历史扫描（tools/preflight.sh 两段都跑）
        run: bash tools/preflight.sh

      # 下面这段和 preflight 的第二段是**故意重复**的：preflight 用的是完整规则
      # （含 QQ 号/机器路径），这里是最小可读的一套。两条路都红才算数 ——
      # 安全扫描最怕的是"只有一个入口，而那个入口哪天被人改弱了"。
      - name: 历史提交扫描（密钥 / Cookie / 真实 QQ 号）
        run: |
          set -e
          # 只看**提交进去的内容**（-p 展开补丁），排除依赖目录
          HITS=$(git log --all -p -- . \
                 ':!**/node_modules/**' ':!**/package-lock.json' \
                 | grep -nE 'sk-[A-Za-z0-9_-]{20,}|(SESSDATA|bili_jct|superkey|p_skey)=[[:alnum:]%@_.-]{12,}|(^|[^0-9A-Za-z_.])([2-9][0-9]{8,10})([^0-9A-Za-z_.]|$)' \
                 | grep -vE 'REDACTED|xxxx|XXX|example|placeholder|sk-\.\.\.|1100000[0-9]{3}|999000[0-9]{3}|1000[0-9]|549000912|1[67][0-9]{8}|[0-9]+\+[A-Za-z0-9-]+@users\.noreply\.github\.com|888888888|999999999|876543210|111111|222222|333333|123456789' \
                 | head -20 || true)
          if [ -n "$HITS" ]; then
            echo "::error::历史提交里发现疑似密钥 / 真实 QQ 号。密钥要先吊销；然后改写历史（见 docs/开源指南.md §0.2 与 tools/preflight.sh 末尾打印的配方）"
            echo "$HITS"
            exit 1
          fi
          echo "历史提交干净。"

      - name: 确认没有敏感文件被跟踪
        run: |
          set -e
          BAD=$(git ls-files | grep -E '(^|/)(config\.json|\.env)$|_state\.json$|memory\.json$|mood\.json$|bili_state\.json$|\.log$' || true)
          if [ -n "$BAD" ]; then
            echo "::error::这些文件不该进版本库："
            echo "$BAD"
            exit 1
          fi
          echo "没有被跟踪的敏感文件。"
